  <script>
    function loadLocalImage(event, targetId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetId).src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function downloadBanner(scaleMultiplier) {
      const node = document.getElementById('feature-graphic');
      const btn = document.getElementById('download-btn');
      const originalText = btn.innerText;
      btn.innerText = '⏳ Rendering Optimized JPG...';

      try {
        // quality: 0.92 with pixelRatio: 4 produces a razor-sharp 4K image 
        // with file size between 1.5MB and 3.5MB (well below Google Play's 15MB limit)
        const dataUrl = await htmlToImage.toJpeg(node, {
          quality: 0.92,
          pixelRatio: scaleMultiplier,
          backgroundColor: '#02120e',
          cacheBust: true
        });
        const link = document.createElement('a');
        link.download = scaleMultiplier === 4 
          ? 'Buddy-2.0-Feature-Graphic-4K.jpg' 
          : 'Buddy-2.0-Feature-Graphic-1024x500.jpg';
        link.href = dataUrl;
        link.click();
      } catch (err) {
        alert('To export without CORS restrictions, click "Load Left Screen" and "Load Right Screen" to select your local PNG files first!');
        console.error(err);
      } finally {
        btn.innerText = originalText;
      }
    }
  </script>
